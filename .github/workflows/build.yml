name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      - name: Tests
        run: cargo test --release

      - name: Compilar
        run: cargo build --release

      - name: Preparar descarga y SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/albioncompo-overlay.exe dist/
          $hash = (Get-FileHash dist/albioncompo-overlay.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  albioncompo-overlay.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          $size = (Get-Item dist/albioncompo-overlay.exe).Length
          "### albioncompo-overlay.exe" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
          "- Tamaño: $([math]::Round($size / 1MB, 2)) MB" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: albioncompo-overlay-windows
          path: dist/
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: albioncompo-overlay-windows
          path: dist

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file <(echo "SHA-256:"; cat dist/SHA256SUMS.txt)
